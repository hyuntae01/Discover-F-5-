    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

<body>
  <div id="__bundler_placeholder">Loading OfficeTone 전체 흐름 프로토타입 v2...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ox-sizing: border-box\">\n      <button type=\"button\" sc-camel-on-click=\"{{ goHome }}\" style=\"border: none; background: none; padding: 4px 0; font-family: inherit; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; color: #111827\"><span style=\"color: #1764E8\">Office<\u002Fspan>Tone<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- 화면 1. 홈 -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <main style=\"flex-grow: 1; display: flex; align-items: center\">\n      <div style=\"width: 100%; max-width: 1120px; margin: 0 auto; padding: 72px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 64px\">\n        <div style=\"flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 36px\">\n          <div style=\"display: flex; flex-direction: column; gap: 20px\">\n            <h1 style=\"margin: 0; font-size: clamp(1.75rem, 4.4vw, 3.25rem); line-height: 1.3; font-weight: 800; letter-spacing: -0.03em\">하고 싶은 말을,<br><span style=\"color: #1764E8; white-space: nowrap\">회사에서 할 수 있는 말로.<\u002Fspan><\u002Fh1>\n            <p style=\"margin: 0; font-size: 1.125rem; line-height: 1.7; color: #4B5563\">상대방과 상황만 고르면, 원래 뜻은 그대로 두고<br>업무에 맞는 표현으로 바꿔 드려요.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 16px\">\n            <button type=\"button\" class=\"ot-cta\" sc-camel-on-click=\"{{ startInput }}\" style=\"display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 30px; border: none; border-radius: 12px; background: #1764E8; color: #FFFFFF; font-family: inherit; font-size: 1.0625rem; font-weight: 700\">문장 바꾸러 가기\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <button type=\"button\" class=\"ot-sub\" sc-camel-on-click=\"{{ goSituations }}\" style=\"display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; border: none; background: none; font-family: inherit; font-size: 1rem; font-weight: 500; color: #1764E8\">상황별 표현 보기\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; min-width: 0; display: flex; justify-content: center\">\n          <div style=\"width: 100%; max-width: 440px; box-sizing: border-box; padding: 36px 32px; background: #FFFFFF; border: 1px solid #E6EAF0; border-radius: 20px; box-shadow: 0 2px 10px rgba(17, 24, 39, 0.04); display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"align-self: flex-start; max-width: 85%; padding: 14px 18px; border-radius: 16px 16px 16px 4px; background: #EEF1F5; color: #374151; font-size: 0.9375rem; line-height: 1.6\">자료 왜 아직 안 주셨어요?<\u002Fdiv>\n            <div style=\"align-self: center; color: #9AA3AF; display: flex\">\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"M6 13l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"align-self: flex-end; max-width: 90%; padding: 14px 18px; border-radius: 16px 16px 4px 16px; background: #E8F0FE; border: 1px solid #CFE0FC; color: #0F3E91; font-size: 0.9375rem; font-weight: 500; line-height: 1.6\">지난번 요청드린 자료의 전달 일정 확인 부탁드립니다.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- 화면 2. 문장 입력 및 옵션 선택 -->\n  <sc-if value=\"{{ isInput }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"flex-grow: 1\">\n      <div style=\"max-width: 800px; margin: 0 auto; padding: 56px 32px 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px\">\n        <h1 style=\"margin: 0; font-size: clamp(1.75rem, 3.2vw, 2.25rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.3\">회사 말투로 바꾸기<\u002Fh1>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <label for=\"ot-proto2-source\" style=\"font-size: 0.9375rem; font-weight: 700; color: #374151\">하고 싶은 말<\u002Flabel>\n          <textarea id=\"ot-proto2-source\" class=\"ot-input\" value=\"{{ text }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"바꾸고 싶은 문장을 그대로 적어 주세요.\" style=\"width: 100%; min-height: 160px; box-sizing: border-box; padding: 18px 20px; border: 1px solid #D5DBE4; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 1.0625rem; line-height: 1.7; color: #111827; resize: vertical\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E6EAF0; border-radius: 16px; padding: 8px 24px; display: flex; flex-direction: column\">\n          <sc-for list=\"{{ groups }}\" as=\"group\" hint-placeholder-count=\"3\">\n            <div role=\"radiogroup\" aria-label=\"{{ group.label }}\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 18px 0; border-top: {{ group.divider }}\">\n              <div style=\"flex: 0 0 96px; font-size: 0.9375rem; font-weight: 700; color: #374151\">{{ group.label }}<\u002Fdiv>\n              <div style=\"flex: 1 1 320px; display: flex; flex-wrap: wrap; gap: 10px\">\n                <sc-for list=\"{{ group.options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                  <sc-if value=\"{{ opt.on }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button type=\"button\" class=\"ot-chip\" role=\"radio\" aria-checked=\"true\" sc-camel-on-click=\"{{ opt.pick }}\" style=\"display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 104px; height: 44px; padding: 0 18px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #1764E8; background: #EAF2FE; color: #1764E8; font-family: inherit; font-size: 0.9375rem; font-weight: 700\">\n                      <span style=\"width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 4.5px solid #1764E8; background: #FFFFFF; flex-shrink: 0\"><\u002Fspan>{{ opt.label }}\n                    <\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ opt.off }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button type=\"button\" class=\"ot-chip\" role=\"radio\" aria-checked=\"false\" sc-camel-on-click=\"{{ opt.pick }}\" style=\"display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 104px; height: 44px; padding: 0 18px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #D5DBE4; background: #FFFFFF; color: #4B5563; font-family: inherit; font-size: 0.9375rem; font-weight: 500\">\n                      <span style=\"width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #B8C0CC; background: #FFFFFF; flex-shrink: 0\"><\u002Fspan>{{ opt.label }}\n                    <\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ canConvert }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" class=\"ot-cta\" sc-camel-on-click=\"{{ convert }}\" style=\"display: flex; align-items: center; justify-content: center; width: 100%; height: 58px; border: none; border-radius: 14px; background: #1764E8; color: #FFFFFF; font-family: inherit; font-size: 1.0625rem; font-weight: 700\">회사 말투로 바꾸기<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ cannotConvert }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" disabled=\"disabled\" style=\"display: flex; align-items: center; justify-content: center; width: 100%; height: 58px; border: none; border-radius: 14px; background: #C9D3E1; color: #FFFFFF; font-family: inherit; font-size: 1.0625rem; font-weight: 700; cursor: not-allowed\">회사 말투로 바꾸기<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- 화면 3. 변환 완료 -->\n  <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"flex-grow: 1\">\n      <div style=\"max-width: 800px; margin: 0 auto; padding: 56px 32px 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px\">\n        <h1 style=\"margin: 0; font-size: clamp(1.75rem, 3.2vw, 2.25rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.3\">변환 완료<\u002Fh1>\n        <div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 10px\">\n          <section aria-label=\"기존 문장\" style=\"padding: 20px 24px; border-radius: 14px; background: #F1F4F8; border: 1px solid #E3E8EF; display: flex; flex-direction: column; gap: 8px\">\n            <div style=\"font-size: 0.8125rem; font-weight: 700; color: #5B6472\">기존 문장<\u002Fdiv>\n            <p style=\"margin: 0; font-size: 1.0625rem; line-height: 1.7; color: #374151; white-space: pre-line\">{{ text }}<\u002Fp>\n          <\u002Fsection>\n          <div style=\"align-self: center; color: #9AA3AF; display: flex\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"M6 13l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <section aria-label=\"변환된 문장\" ight=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9AA3AF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n                    <span style=\"font-weight: 700; color: #1459CF\">{{ c.to }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ c.isPlain }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span>{{ c.text }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fsection>\n        <\u002Fsc-if>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n          <button type=\"button\" class=\"ot-cta\" sc-camel-on-click=\"{{ copy }}\" style=\"flex: 1 1 220px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border: none; border-radius: 14px; background: #1764E8; color: #FFFFFF; font-family: inherit; font-size: 1.0625rem; font-weight: 700\">\n            <sc-if value=\"{{ notCopied }}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M5 15V6a2 2 0 0 1 2-2h9\"><\u002Fpath><\u002Fsvg>\n              <span>복사하기<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ copied }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>\n              <span>복사했어요<\u002Fspan>\n            <\u002Fsc-if>\n          <\u0 yle=\"flex-grow: 1; font-size: 1.0625rem; font-weight: 700\">자료 요청<\u002Fspan>\n            <svg class=\"ot-chev\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"color: #9AA3AF; flex-shrink: 0\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <button type=\"button\" class=\"ot-card\" sc-camel-on-click=\"{{ pickRemind }}\" style=\"display: flex; align-items: center; gap: 16px; min-height: 92px; padding: 20px 20px 20px 22px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E6EAF0; border-radius: 16px; font-family: inherit; text-align: left; color: #111827\">\n            <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #E3F5EC; color: #1F8A55; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M3.5 6.5l8.5 6.5 8.5-6.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span style=\"flex-grow: 1; font-size: 1.0625rem; font-weight: 700\">답장 리마인드<\u002Fspan>\n            <svg class=\"ot-chev\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"color: #9AA3AF; flex-shrink: 0\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <button type=\"button\" class=\"ot-card\" sc-camel-on-click=\"{{ pickDecline }}\" style=\"display: flex; align-items: center; gap: 16px; min-height: 92px; padding: 20px 20px 20px 22px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E6EAF0; border-radius: 16px; font-family: inherit; text-align: left; color: #111827\">\n            <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #FDE8EC; color: #D23A5A; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M5.7 5.7l12.6 12.6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span style=\"flex-grow: 1; font-size: 1.0625rem; font-weight: 700\">부탁 거절<\u002Fspan>\n            <svg class=\"ot-chev\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"color: #9AA3AF; flex-shrink: 0\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <button type=\"button\" class=\"ot-card\" sc-camel-on-click=\"{{ pickSorry }}\" style=\"display: flex; align-items: center; gap: 16px; min-height: 92px; padding: 20px 20px 20px 22px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E6EAF0; border-radius: 16px; font-family: inherit; text-align: left; color: #111827\">\n            <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #EFEAFB; color: #6B46C1; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7.5v5.5\"><\u002Fpath><path d=\"M12 16.5h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span style=\"flex-grow: 1; font-size: 1.0625rem; font-weight: 700\">실수 사과<\u002Fspan>\n            <svg class=\"ot-chev\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"color: #9AA3AF; flex-shrink: 0\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <button type=\"button\" class=\"ot-card\" sc-camel-on-click=\"{{ pickOpinion }}\" style=\"display: flex; align-items: center; gap: 16px; min-height: 92px; padding: 20px 20px 20px 22px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E6EAF0; border-radius: 16px; font-family: inherit; text-align: left; color: #111827\">\n            <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #FFF4D6; color: #B7791F; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span style=\"flex-grow: 1; font-size: 1.0625rem; font-weight: 700\">상사에게 의견 전달<\u002Fspan>\n            <svg class=\"ot-chev\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"color: #9AA3AF; flex-shrink: 0\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst OT_PRESETS = {\n  '기본 예시': {\n    text: '대한은행 담당자님 안녕하세요! 김삼일 회계사입니다.\\n보냈던 민국테크의 금융조회서를 20일까지 회신받아야 해서 연락드려요.\\n장부 대사가 필요해서 급한 자료라 제게 빠르게 우편으로 회신 부탁드려요.',\n    target: '외부 고객', tone: '격식 있게', channel: '이메일',\n    result: { pre: '대한은행 담당자님, 안녕하십니까.\\n김삼일 회계사입니다.\\n앞서 송부드린 민국테크의 금융조회서 회신 건으로 연락드립니다.\\n장부 대사를 위해 회신 일정이 다소 촉박하여, 번거로우시겠지만 ', em: '20일까지 우편으로 회신해 주시면 감사하겠습니다', post: '.\\n바쁘신 중에 협조해 주셔서 진심으로 감사드립니다.' },\n    changes: [['구어체 표현(~요, 느낌표)', '격식 있는 이메일 문체로 변경'], ['\"급한 자료라 제게 빠르게\"', '촉박한 일정을 정중하게 설명'], '핵심 내용(금융조회서·20일·우편 회신)은 그대로 유지']\n  },\n  '자료 요청': {\n    text: '어제 말한 정리 자료 아직이에요? 오늘 안에 주세요.', target: '후배', tone: '기본', channel: '메신저',\n    result: { pre: '어제 이야기한 정리 자료, 진행 상황이 어떤지 궁금해요.\\n가능하면 오늘 중으로 ', em: '공유 부탁드려요', post: '!' },\n    changes: [['재촉하는 질문', '진행 상황 확인 표현으로 변경'], '지시형 문장을 부드러운 요청으로 변경', '핵심 내용(자료·오늘까지)은 그대로 유지']\n  },\n  '답장 리마인드': {\n    text: '저번에 보낸 메일 확인하셨어요? 답이 없으셔서요.', target: '외부 고객', tone: '격식 있게', channel: '이메일',\n    result: { pre: '안녕하세요.\\n지난번 보내드린 메일 건으로 다시 연락드립니다.\\n내용 검토 후 ', em: '회신 주시면 감사하겠습니다', post: '.\\n좋은 하루 보내세요.' },\n    changes: [['답이 없다는 지적', '정중한 회신 요청으로 변경'], '인사와 마무리 문장 추가', '핵심 내용(메일 확인·회신 요청)은 그대로 유지']\n  },\n  '부탁 거절': {\n    text: '이번 주는 일이 너무 많아서 그거 못 할 것 같아요.', target: '동료', tone: '부드럽게', channel: '메신저',\n    result: { pre: '말씀해 줘서 고마워요!\\n그런데 이번 주는 맡은 일이 많아서 ', em: '제가 맡기는 어려울 것 같아요', post: '.\\n도움 드리지 못해 미안해요.' },\n    changes: [['단정적인 거절', '이유를 담은 완곡한 거절로 변경'], '감사와 양해 표현 추가', '핵심 내용(이번 주는 어려움)은 그대로 유지']\n  },\n  '실수 사과': {\n    text: '아까 보낸 파일 잘못 보냈어요. 다시 보낼게요.', target: '상사', tone: '격식 있게', channel: '메신저',\n    result: { pre: '조금 전 보내드린 파일이 잘못 첨부되었습니다.\\n', em: '확인이 부족했던 점 죄송합니다', post: '.\\n수정한 파일 바로 다시 보내드리겠습니다.' },\n    changes: [['사실만 전달', '정중한 사과 표현 추가'], '격식 있는 종결 어미로 변경', '핵심 내용(파일 재전송)은 그대로 유지']\n  },\n  '상사에게 의견 전달': {\n    text: '이 일정은 너무 빡빡해서 현실적으로 힘들 것 같아요.', target: '상사', tone: '부드럽게', channel: '이메일',\n    result: { pre: '안녕하세요.\\n공유해 주신 일정을 검토해 보았는데, 현재 업무량을 고려하면 기한 내 마무리가 다소 빠듯할 것 같습니다.\\n', em: '일정 조정이 가능할지 한번 논의드리고 싶습니다', post: '.\\n편하실 때 말씀 부탁드립니다. 감사합니다.' },\n    changes: [['부정적인 단정', '근거를 담은 의견 표현으로 변경'], '인사와 논의 제안 추가', '핵심 내용(일정이 빠듯함)은 그대로 유지']\n  }\n};\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = Object.assign({ screen: 'home', copied: false }, this.fields('기본 예시'));\n  }\n  fields(name) {\n    const p = OT_PRESETS[name];\n    return { text: p.text, target: p.target, tone: p.tone, channel: p.channel };\n  }\n  load(name) {\n    this.setState(Object.assign({ screen: 'input', copied: false }, this.fields(name)));\n  }\n  componentWillUnmount() {\n    clearTimeout(this.timer);\n  }\n  renderVals() {\n    const s = this.state;\n    const defs = [\n      { key: 'target', label: '상대방', options: ['상사', '동료', '후배', '외부 고객'] },\n      { key: 'tone', label: '톤앤매너', options: ['부드럽게', '기본', '격식 있게'] },\n      { key: 'channel', label: '전달 채널', options: ['메신저', '이메일'] }\n    ];\n    const groups = defs.map((g, i) => ({\n      label: g.label,\n      divider: i === 0 ? 'none' : '1px solid #EEF1F5',\n      options: g.options.map((o) => ({\n        label: o,\n        on: s[g.key] === o,\n        off: s[g.key] !== o,\n        pick: () => this.setState({ [g.key]: o })\n      }))\n    }));\n    const trimmed = (s.text || '').trim();\n    const match = Object.keys(OT_PRESETS).map((k) => OT_PRESETS[k]).find((p) => p.text === trimmed);\n    const result = match ? match.result : { pre: '', em: '', post: '' };\n    const changes = match ? match.changes.map((c) => Array.isArray(c)\n      ? { isArrow: true, isPlain: false, from: c[0], to: c[1], text: '' }\n      : { isArrow: false, isPlain: true, from: '', to: '', text: c }) : [];\n    const go = (screen) => () => this.setState({ screen, copied: false });\n    return {\n      isHome: s.screen === 'home',\n      isInput: s.screen === 'input',\n      isResult: s.screen === 'result',\n      isSituations: s.screen === 'situations',\n      text: s.text,\n      groups,\n      canConvert: trimmed.length > 0,\n      cannotConvert: trimmed.length === 0,\n      hasResult: !!match,\n      noResult: !match,\n      result,\n      changes,\n      copied: s.copied,\n      notCopied: !s.copied,\n      onText: (e) => this.setState({ text: e.target.value }),\n      goHome: go('home'),\n      goInput: go('input'),\n      goSituations: go('situations'),\n      startInput: () => this.load('기본 예시'),\n      convert: () => this.setState({ screen: 'result', copied: false }),\n      pickReq: () => this.load('자료 요청'),\n      pickRemind: () => this.load('답장 리마인드'),\n      pickDecline: () => this.load('부탁 거절'),\n      pickSorry: () => this.load('실수 사과'),\n      pickOpinion: () => this.load('상사에게 의견 전달'),\n      copy: () => {\n        const full = result.pre + result.em + result.post;\n        try { if (full && navigator.clipboard) navigator.clipboard.writeText(full).catch(() => {}); } catch (e) {}\n        this.setState({ copied: true });\n        clearTimeout(this.timer);\n        this.timer = setTimeout(() => this.setState({ copied: false }), 1800);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
