<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover F-5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      text-align: center;
      padding: 16px;
    }
    main { max-width: 480px; }
    h1 { font-size: 2.5rem; margin-bottom: 12px; }
    p { color: #94a3b8; margin-bottom: 24px; }
    button {
      font-size: 1rem;
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
    }
    #message { margin-top: 20px; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Discover F-5</h1>
    <p>바닐라 HTML/JS로 만든 첫 화면입니다.</p>
    <button id="btn" type="button">시작하기</button>
    <div id="message"></div>
  </main>
  <script>
    document.getElementById('btn').addEventListener('click', function () {
      document.getElementById('message').textContent = '환영합니다!';
    });
  </script>
</body>
</html>
